<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISIT — Découvre et partage</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{user-select:text;-webkit-user-select:text}
body{margin:0;background:#08090d;color:#f7f7fb;font:15px Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#0b0c12;padding-bottom:76px}
header{height:58px;position:sticky;top:0;background:#0b0c12ee;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:5;border-bottom:1px solid #242631}
.logo{font-size:26px;font-weight:900;letter-spacing:1px}.logo span{color:#ff315d}.head-actions{display:flex;gap:12px;align-items:center}.btn{border:0;border-radius:10px;padding:11px 14px;background:#292c36;color:white;font-weight:700}.primary{background:linear-gradient(100deg,#ff315d,#ff684d)}.round{border-radius:50%;width:40px;height:40px;padding:0;font-size:20px}
.tabs{display:flex;gap:16px;align-items:center}.tabs button{background:none;border:0;color:#aaa;font-weight:700;padding:8px 0}.tabs button.active{color:white;border-bottom:2px solid #ff315d}
.screen{display:none}.screen.active{display:block}.feed{height:calc(100vh - 134px);min-height:560px;position:relative;background:#161823;overflow:hidden}
.media{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#1c344a,#52234e 60%,#101018)}.media img,.media video{width:100%;height:100%;object-fit:contain;background:#050609}.welcome{text-align:center;padding:25px}.welcome b{font-size:52px}.welcome small{display:block;margin-top:12px;color:#ddd}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 48%,#000b 100%)}
.info{position:absolute;left:16px;right:82px;bottom:22px;z-index:2}.info b{font-size:16px}.info p{margin:8px 0}.actions{position:absolute;right:12px;bottom:80px;z-index:3;display:flex;flex-direction:column;gap:13px;align-items:center}.act{background:transparent;color:white;text-shadow:0 1px 5px #000;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:24px}.act small{font-size:11px}.act.liked{color:#ff315d}.act.disliked{color:#ffd15c}.bubble{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffffff30;border:1px solid #ffffff88;overflow:hidden}.bubble img{width:100%;height:100%;object-fit:cover}
nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;background:#111219;border-top:1px solid #292c36;display:flex;justify-content:space-around;align-items:center}.nav{background:none;color:#aeb2bf;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}.nav b{font-size:25px}.nav.active{color:white}.nav.create b{background:linear-gradient(90deg,#24d6cf 0 18%,white 18% 82%,#ff315d 82%);color:#111;border-radius:8px;padding:0 13px}
.page{padding:24px 17px}.page h2{margin:5px 0 18px}.card{background:#151720;border:1px solid #292c36;border-radius:15px;padding:16px;margin:12px 0}.field{width:100%;padding:13px;border:1px solid #383b47;border-radius:10px;background:#0b0c12;color:white;margin:7px 0 13px;font-size:16px}.label{display:block;color:#c4c7d0;font-size:13px;margin-top:8px}.hint{font-size:12px;color:#aeb2bf;line-height:1.5}.row{display:flex;gap:9px;flex-wrap:wrap}.profile{text-align:center;padding-top:30px}.avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#24d6cf,#ff315d);display:grid;place-items:center;margin:auto;font-size:30px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.stats{display:flex;justify-content:space-around;margin:22px 0}.stats strong{display:block;font-size:19px}.stats small{color:#aeb2bf}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:15px}.tile{aspect-ratio:3/4;background:#25283a;display:grid;place-items:center;overflow:hidden}.tile img,.tile video{width:100%;height:100%;object-fit:cover}
.modal{display:none;position:fixed;inset:0;z-index:30;background:#000b;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:#171923;border-radius:20px 20px 0 0;padding:22px 18px 30px}.sheet h3{margin:0 0 15px}.close{float:right;border:0;border-radius:50%;width:34px;height:34px;background:#303340;color:white}.list button{width:100%;text-align:left;padding:14px;background:none;color:white;border:0;border-bottom:1px solid #303340}.comment{padding:9px 0;border-bottom:1px solid #303340}.error{color:#ff8399}.success{color:#8de5bb}
@media(min-width:600px){body{background:#050609}.app{box-shadow:0 0 40px #000}}
</style></head><body><div class="app">
<header><div class="logo">IS<span>IT</span></div><div class="head-actions" id="homeHead"><div class="tabs"><button class="active" id="publicTab" onclick="loadFeed('public')">Pour toi</button><button id="followTab" onclick="loadFeed('following')">Abonnements</button></div><button class="btn round" onclick="searchUI()">⌕</button></div><button class="btn round" id="menuBtn" style="display:none" onclick="settingsUI()">⋮</button></header>
<section class="screen active" id="home"><div class="feed"><div class="media" id="media"><div class="welcome"><b>ISIT</b><small>Découvre. Partage. Connecte-toi.</small></div></div><div class="shade"></div><div class="info"><b id="author">@isit</b><p id="caption">Les nouvelles vidéos apparaîtront ici.</p><small id="audioTitle">♫ ISIT</small></div><div class="actions"><button class="act" onclick="showAuthor()"><span class="bubble" id="authorAvatar">I</span><small>Profil</small></button><button class="act" id="like" onclick="react('like')">♥<small id="likes">0</small></button><button class="act" id="dislike" onclick="react('dislike')">👎<small id="dislikes">0</small></button><button class="act" onclick="commentsUI()">▢<small>Commenter</small></button><button class="act" id="sound" onclick="toggleSound()">🔇<small>Son</small></button></div></div></section>
<section class="screen" id="create"><div class="page"><h2>Créer une publication</h2><div class="card"><label class="label">Photo ou vidéo</label><input class="field" type="file" id="mediaFile" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime"><label class="label">Description</label><textarea class="field" id="postCaption" rows="3" maxlength="2200" placeholder="Raconte ton moment..."></textarea><label class="label">Visibilité</label><select class="field" id="visibility"><option value="public">Public</option><option value="followers">Abonnés</option><option value="private">Privé</option></select><button class="btn primary" style="width:100%" onclick="publish()">Publier</button><p class="hint">Formats photo et vidéo acceptés. Taille maximale : 100 Mo.</p></div></div></section>
<section class="screen" id="profile"><div class="page profile"><div class="avatar" id="avatar">?</div><h2 id="name">Mon profil</h2><p class="hint" id="handle">@visiteur</p><div class="stats"><div><strong id="myPosts">0</strong><small>Publications</small></div><div><strong id="followers">0</strong><small>Abonnés</small></div><div><strong id="following">0</strong><small>Abonnements</small></div></div><div class="row" style="justify-content:center"><button class="btn" onclick="editProfileUI()">Modifier le profil</button><button class="btn" onclick="settingsUI()">Paramètres</button></div><div class="grid" id="myGrid"></div></div></section>
<nav><button class="nav active" id="navHome" onclick="screen('home')"><b>⌂</b>Accueil</button><button class="nav create" id="navCreate" onclick="screen('create')"><b>＋</b>Créer</button><button class="nav" id="navProfile" onclick="screen('profile')"><b>◉</b>Profil</button></nav></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
let me=null,posts=[],index=0,feedMode="public",lang="fr",currentPost=null,muted=true;
const $=id=>document.getElementById(id);
const tr=(fr,en)=>lang==="fr"?fr:en;
async function api(url,opts={}){let r=await fetch(url,{credentials:"same-origin",...opts});let data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||"Une erreur est survenue.");return data}
function form(method="POST"){return {method,credentials:"same-origin"}}
function openModal(s){$("sheet").innerHTML=s;$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}
function screen(which){if(which==="create"&&!me){authUI("Inscris-toi ou connecte-toi pour publier.");return}document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(which).classList.add("active");["navHome","navCreate","navProfile"].forEach(x=>$(x).classList.remove("active"));({home:"navHome",create:"navCreate",profile:"navProfile"})[which]&&$(({home:"navHome",create:"navCreate",profile:"navProfile"})[which]).classList.add("active");$("homeHead").style.display=which==="home"?"flex":"none";$("menuBtn").style.display=which==="profile"?"block":"none";if(which==="profile")profileLoad()}
function showError(e){alert(e.message||String(e))}
async function loadFeed(mode="public"){feedMode=mode;$("publicTab").classList.toggle("active",mode==="public");$("followTab").classList.toggle("active",mode==="following");try{let d=await api("/api/posts?mode="+mode);posts=d.posts;index=0;renderPost()}catch(e){showError(e)}}
function renderPost(){currentPost=posts[index]||null;let m=$("media");m.innerHTML="";if(!currentPost){m.innerHTML='<div class="welcome"><b>ISIT</b><small>Aucune vidéo pour le moment. Sois le premier à publier !</small></div>';$("author").textContent="@isit";$("caption").textContent="";$("likes").textContent="0";$("dislikes").textContent="0";return}
let p=currentPost;if(p.mediaType==="video"){let v=document.createElement("video");v.src=p.mediaUrl;v.controls=true;v.autoplay=true;v.loop=true;v.playsInline=true;v.muted=true;v.addEventListener("volumechange",()=>{muted=v.muted;updateSound()});m.append(v);v.play().catch(()=>{})}else{let im=document.createElement("img");im.src=p.mediaUrl;im.alt="Publication ISIT";m.append(im)}
$("author").textContent="@"+p.author.handle;$("caption").textContent=p.caption;$("authorAvatar").innerHTML=p.author.avatar?`<img src="${p.author.avatar}">`:p.author.name.slice(0,1).toUpperCase();$("likes").textContent=p.likes;$("dislikes").textContent=p.dislikes;$("like").classList.toggle("liked",p.myReaction==="like");$("dislike").classList.toggle("disliked",p.myReaction==="dislike");updateSound()}
function updateSound(){let v=$("media").querySelector("video");$("sound").firstChild.textContent=(!v||v.muted)?"🔇":"🔊";$("sound").lastElementChild.textContent=(!v||v.muted)?tr("Activer le son","Turn sound on"):tr("Couper le son","Mute")}
function toggleSound(){let v=$("media").querySelector("video");if(!v)return alert(tr("Cette publication est une photo ou ne contient pas de vidéo.","This post is a photo or has no video."));v.muted=!v.muted;v.volume=1;if(!v.muted)v.play().catch(()=>{});updateSound()}
async function react(kind){if(!me)return authUI("Connecte-toi pour réagir aux publications.");if(!currentPost)return;try{let next=currentPost.myReaction===kind?null:kind;await api(`/api/posts/${currentPost.id}/reaction`,{...form(),headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:next})});await loadFeed(feedMode)}catch(e){showError(e)}}
function authUI(msg="Crée ton compte ISIT ou connecte-toi."){let countries=[["RDC","+243"],["France","+33"],["États-Unis","+1"],["Royaume-Uni","+44"],["Canada","+1"],["Afrique du Sud","+27"],["Zambie","+260"],["Kenya","+254"],["Nigeria","+234"],["Inde","+91"],["Chine","+86"],["Brésil","+55"],["Allemagne","+49"],["Belgique","+32"],["Côte d’Ivoire","+225"],["Sénégal","+221"],["Maroc","+212"],["Australie","+61"]];let opts=countries.map(c=>`<option value="${c[1]}" ${c[0]==="RDC"?"selected":""}>${c[0]} (${c[1]})</option>`).join("");openModal(`<button class="close" onclick="closeModal()">×</button><h3>Bienvenue sur ISIT</h3><p class="hint">${msg}</p><div class="tabs"><button class="active" id="regTab" onclick="authForm('register')">Créer un compte</button><button id="loginTab" onclick="authForm('login')">Connexion</button></div><div id="authFields"><label class="label">Nom</label><input class="field" id="authName" placeholder="Ton nom"><label class="label">Code du pays</label><select class="field" id="code">${opts}</select><label class="label">Téléphone</label><input class="field" id="phone" type="tel" placeholder="Numéro sans le code pays"><label class="label">Mot de passe (8 caractères minimum)</label><input class="field" id="password" type="password" minlength="8"><button class="btn primary" style="width:100%" onclick="submitAuth('register')">Créer mon compte</button></div><p class="hint">Le compte est enregistré sur ce serveur. La vérification du numéro par SMS devra être activée avec un fournisseur SMS avant l'ouverture publique.</p>`)}
function authForm(mode){let isReg=mode==="register";$("regTab").classList.toggle("active",isReg);$("loginTab").classList.toggle("active",!isReg);$("authFields").innerHTML=`${isReg?'<label class="label">Nom</label><input class="field" id="authName" placeholder="Ton nom">':''}${isReg?'<label class="label">Code du pays</label><select class="field" id="code">'+[['RDC','+243'],['France','+33'],['États-Unis','+1'],['Royaume-Uni','+44'],['Canada','+1'],['Afrique du Sud','+27'],['Zambie','+260'],['Kenya','+254'],['Nigeria','+234'],['Inde','+91'],['Chine','+86'],['Brésil','+55'],['Allemagne','+49'],['Belgique','+32'],['Côte d’Ivoire','+225'],['Sénégal','+221'],['Maroc','+212'],['Australie','+61']].map(c=>`<option value="${c[1]}">${c[0]} (${c[1]})</option>`).join('')+'</select>':''}<label class="label">Téléphone ${isReg?"":"(avec indicatif)"}</label><input class="field" id="phone" type="tel" placeholder="+243..."><label class="label">Mot de passe</label><input class="field" id="password" type="password"><button class="btn primary" style="width:100%" onclick="submitAuth('${mode}')">${isReg?"Créer mon compte":"Se connecter"}</button>`}
async function submitAuth(mode){try{let phone=$("phone").value.trim();if(mode==="register")phone=$("code").value+phone.replace(/^0+/,"");let body={phone,password:$("password").value};if(mode==="register")body.name=$("authName").value.trim();let d=await api("/api/auth/"+mode,{...form(),headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});me=d.user;closeModal();await loadFeed(feedMode);profileLoad();if(d.notice)alert(d.notice)}catch(e){showError(e)}}
async function publish(){if(!me)return authUI();let f=$("mediaFile").files[0];if(!f)return alert("Sélectionne une photo ou une vidéo.");let fd=new FormData();fd.append("media",f);fd.append("caption",$("postCaption").value);fd.append("visibility",$("visibility").value);try{await api("/api/posts",{method:"POST",body:fd,credentials:"same-origin"});$("mediaFile").value="";$("postCaption").value="";await loadFeed("public");screen("home")}catch(e){showError(e)}}
async function profileLoad(){try{if(!me){$("name").textContent="Visiteur";$("handle").textContent="@visiteur";$("avatar").textContent="?";$("myGrid").innerHTML="";return}let d=await api("/api/users/"+encodeURIComponent(me.handle));$("name").textContent=me.name;$("handle").textContent="@"+me.handle;$("avatar").innerHTML=me.avatar?`<img src="${me.avatar}">`:me.name.slice(0,1).toUpperCase();$("followers").textContent=d.counts.followers;$("following").textContent=d.counts.following;let own=posts.filter(p=>p.author.id===me.id);$("myPosts").textContent=d.counts.posts;$("myGrid").innerHTML=own.map(p=>`<div class="tile">${p.mediaType==="image"?`<img src="${p.mediaUrl}">`:"▶"}</div>`).join("")||'<p class="hint" style="grid-column:1/4">Tes publications apparaîtront ici.</p>'}catch(e){console.warn(e)}}
function searchUI(){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Rechercher sur ISIT</h3><input class="field" id="query" placeholder="Nom, utilisateur ou publication" oninput="doSearch()"><div id="results" class="hint">Écris pour rechercher.</div>`)}
async function doSearch(){let q=$("query").value;if(!q.trim())return $("results").textContent="Écris pour rechercher.";try{let d=await api("/api/search?q="+encodeURIComponent(q));$("results").innerHTML=d.users.map(u=>`<div class="card"><b>${esc(u.name)}</b> @${esc(u.handle)}</div>`).join("")+d.posts.map(p=>`<div class="card"><b>@${esc(p.author.handle)}</b><br>${esc(p.caption)}</div>`).join("")||"Aucun résultat."}catch(e){$("results").textContent=e.message}}
function commentsUI(){if(!currentPost)return;let comments=currentPost.comments.map(c=>`<div class="comment"><b>${esc(c.name)}</b><br>${esc(c.body)}</div>`).join("")||'<p class="hint">Aucun commentaire.</p>';openModal(`<button class="close" onclick="closeModal()">×</button><h3>Commentaires</h3>${comments}<input class="field" id="commentBody" placeholder="Écrire un commentaire..."><button class="btn primary" style="width:100%" onclick="sendComment()">Envoyer</button>`)}
async function sendComment(){if(!me)return authUI();let body=$("commentBody").value.trim();if(!body)return;try{await api(`/api/posts/${currentPost.id}/comments`,{...form(),headers:{"Content-Type":"application/json"},body:JSON.stringify({body})});closeModal();await loadFeed(feedMode)}catch(e){showError(e)}}
function showAuthor(){if(currentPost)alert("@"+currentPost.author.handle+" — "+currentPost.author.name)}
function editProfileUI(){if(!me)return authUI();openModal(`<button class="close" onclick="closeModal()">×</button><h3>Modifier le profil</h3><label class="label">Nom</label><input class="field" id="editName" value="${esc(me.name)}"><label class="label">Photo de profil</label><input class="field" type="file" id="editAvatar" accept="image/*"><button class="btn primary" style="width:100%" onclick="saveProfile()">Enregistrer</button>`)}
async function saveProfile(){let fd=new FormData();fd.append("name",$("editName").value);let f=$("editAvatar").files[0];if(f)fd.append("avatar",f);try{let d=await api("/api/me",{method:"PATCH",body:fd,credentials:"same-origin"});me=d.user;closeModal();profileLoad()}catch(e){showError(e)}}
function settingsUI(){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Paramètres ISIT</h3><div class="list"><button onclick="languageUI()">🌐 Language / Langue</button><button onclick="privacyUI()">🔒 Confidentialité / Privacy</button><button onclick="termsUI()">📄 Conditions d'utilisation / Terms</button><button onclick="logout()">↪ Se déconnecter / Log out</button></div>`)}
function languageUI(){openModal(`<button class="close" onclick="settingsUI()">×</button><h3>Langue / Language</h3><select class="field" id="language"><option value="fr">Français</option><option value="en">English</option></select><button class="btn primary" style="width:100%" onclick="lang=$('language').value;closeModal();applyLang()">Enregistrer / Save</button>`);$("language").value=lang}
function applyLang(){document.documentElement.lang=lang;$("navHome").innerHTML="<b>⌂</b>"+tr("Accueil","Home");$("navCreate").innerHTML="<b>＋</b>"+tr("Créer","Create");$("navProfile").innerHTML="<b>◉</b>"+tr("Profil","Profile");$("publicTab").textContent=tr("Pour toi","For you");$("followTab").textContent=tr("Abonnements","Following")}
function privacyUI(){openModal(`<button class="close" onclick="settingsUI()">×</button><h3>Confidentialité</h3><p>Protège tes informations personnelles. Ne publie pas ton numéro de téléphone, ton adresse ou des données privées. Les options avancées de blocage et de compte privé seront ajoutées dans les prochaines mises à jour.</p>`)}
function termsUI(){openModal(`<button class="close" onclick="settingsUI()">×</button><h3>Conditions d'utilisation</h3><p>Respecte les autres membres. Publie uniquement les photos et vidéos que tu as le droit de partager. Les contenus illégaux, le harcèlement, les menaces et l'usurpation d'identité sont interdits. Les administrateurs peuvent retirer les contenus signalés.</p>`)}
async function logout(){try{await api("/api/auth/logout",form())}catch(e){}me=null;closeModal();await loadFeed("public");screen("home")}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function init(){try{let d=await api("/api/me");me=d.user}catch(e){}await loadFeed("public");}
init();
</script></body></html>
